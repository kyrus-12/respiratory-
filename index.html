<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwyn and Renspiratory System</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --bg-color: black;
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #2ecc71;
            --btn-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        body {
            margin: 0; background: var(--bg-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        /* --- LOGIN & WAITING --- */
        #login-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--bg-color); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .login-box input { display: block; width: 90%; margin: 10px auto; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
        
        #waiting-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #2c3e50; color: white; z-index: 1000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }

        /* --- FULLSCREEN BUTTON --- */
        .fullscreen-btn {
            margin-top: 20px;
            padding: 15px 30px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.3s;
        }
        .fullscreen-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.6);
        }

        /* --- QUIZ SYSTEM --- */
        #quiz-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.96); z-index: 5000; display: none;
            flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .quiz-close-btn {
            position: absolute; top: 20px; right: 30px;
            background: transparent; border: none; color: white;
            font-size: 2.5rem; cursor: pointer; z-index: 5001; transition: 0.3s;
            display: none;
        }
        .quiz-timer { font-size: 4rem; font-weight: 900; color: var(--accent); margin-bottom: 10px; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 80%; max-width: 600px; margin-top: 20px; }
        .quiz-opt { 
            padding: 18px; background: #34495e; color: white; border: none; 
            border-radius: 12px; cursor: pointer; font-size: 1.1rem; 
            transition: 0.3s; position: relative; overflow: hidden;
        }
        
        .player-selected { background: #3498db !important; box-shadow: 0 0 15px #3498db; }
        .correct-answer { background: var(--success) !important; box-shadow: 0 0 20px var(--success); transform: scale(1.05); z-index: 2; }
        
        .quiz-opt:hover:not(:disabled) { background: #4a6278; transform: translateY(-2px); }
        .quiz-opt:disabled { cursor: not-allowed; opacity: 1; color: white; }

        /* --- LEADERBOARD --- */
        #leaderboard {
            position: absolute; top: 15px; left: 15px; width: 260px;
            background: white; border-radius: 10px; padding: 12px;
            box-shadow: var(--btn-shadow); z-index: 6000; transition: 0.3s;
            display: none;
        }
        #leaderboard.minimized { width: 60px; height: 30px; overflow: hidden; cursor: pointer; background: var(--primary); }
        #leaderboard.minimized .rank-content, #leaderboard.minimized h3 { display: none; }
        .rank-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; }
        .rank-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f9f9f9; font-size: 0.9rem; color: #333; }
        .group-pill { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }

        .wrapper {
            position: relative; width: 98vw; max-width: 1000px; aspect-ratio: 3 / 2;
            background: white; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden; display: none;
        }
        #zoom-container { position: relative; width: 100%; height: 100%; transition: transform 0.5s ease; cursor: zoom-in; }
        #zoom-container.zoomed { transform: scale(1.7); }
        .base-img { width: 100%; height: 100%; object-fit: contain; }
        .admin-controls { position: absolute; top: 15px; right: 15px; z-index: 100; display: flex; gap: 10px; }
        .trigger-btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .close-quiz-btn { background: #f39c12; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; }

        /* --- ANATOMY BUTTONS --- */
        .cover-btn {
            position: absolute;
            background: #ffffff; 
            border: 2px solid;
            border-radius: 6px;
            font-size: clamp(8px, 1.1vw, 12px);
            font-weight: 800;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: var(--btn-shadow);
            transition: 0.2s;
            width: 200px; 
            height: 50px;
        }

        .title-btn {
            position: absolute;
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            transform-origin:center;
            width: 500px;
            height: 70px;
            background: #2c3e50;
            color: white;
            border: 3px solid #34495e;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
  
        .cover-btn:hover, .title-btn:hover { 
            filter: brightness(0.95);
        }

        /* --- TAP NODES --- */
        .tap-node {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            z-index: 25;
            animation: pulse 2s infinite;
            transform: translate(-50%, -50%);
            transition: transform 0.2s;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0,0,0,0.4); }
            70% { box-shadow: 0 0 0 12px rgba(0,0,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }

        .tap-node:hover {
            transform: translate(-50%, -50%) scale(1.5);
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        /* --- MODAL & MEDIA - INCREASED TEXT SIZES --- */
        .modal {
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%; 
            max-width: 600px; 
            background: beige; 
            padding: 35px; 
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            visibility: hidden; 
            opacity: 0; 
            transition: 0.3s; 
            z-index: 3000;
        }
        .modal.active { 
            visibility: visible; 
            opacity: 1; 
            transform: translate(-50%, -50%) scale(1); 
        }
        
        /* INCREASED TITLE SIZE */
        .modal h2 {
            font-size: 2rem;
            margin: 0 0 20px 0;
            color: #2c3e50;
            font-weight: 700;
        }
        
        /* INCREASED DESCRIPTION TEXT SIZE */
        .modal p {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #34495e;
            margin: 0 0 20px 0;
        }
        
        .media-box { 
            width: 100%; 
            height: 250px; 
            background: #000; 
            border-radius: 12px; 
            margin-top: 20px; 
            overflow: hidden; 
        }
        
        /* INCREASED CLOSE BUTTON SIZE */
        .close-btn { 
            float: right; 
            font-size: 36px; 
            cursor: pointer; 
            color: #ff4757; 
            font-weight: bold;
            line-height: 1;
        }
        
        .overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.6); 
            display: none; 
            z-index: 2000; 
        }
        
        #yt-player { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
        
        .click-counter {
            position: absolute; top: 80px; right: 30px;
            background: rgba(255,255,255,0.1); padding: 10px 20px;
            border-radius: 10px; font-size: 1.2rem;
        }
        .group-indicator {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 20px;
            font-size: 0.9rem; color: #ecf0f1;
        }
        
        /* Fallback for broken images */
        .img-fallback {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            text-align: center;
        }

        /* Style for highlighted, clickable words */
.speech-link {
    color: black; /* Gold color */
    font-weight: bold;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 2px;
}

.speech-link:hover {
    background-color: rgba(241, 196, 15, 0.2);
    border-radius: 4px;
}
        
    </style>
</head>
<body id="main-body">

<div id="yt-player"></div>

<div id="login-screen">
    <div class="login-box">
        <h2>Respiratory System Portal</h2>
        <input type="text" id="user-name" placeholder="Full Name">
        <input type="text" id="group-id" placeholder="Group Name (Blank for Admin)">
        <input type="password" id="pass-id" placeholder="Password">
        <button class="trigger-btn" style="width:100%" onclick="login()">Connect</button>
    </div>
</div>

<div id="waiting-screen">
    <h1>Student Dashboard</h1>
    <div id="p-score-board" style="font-size: 4rem; color: var(--success); font-weight: bold;">0</div>
    <p id="group-display" style="font-weight:bold; color:#ecf0f1;"></p>
    <p>System: Waiting for Quiz...</p>
    <button class="fullscreen-btn" onclick="enterFullScreen()">⛶ Enter Fullscreen</button>
    <div class="group-indicator" id="group-members-count">Waiting...</div>
</div>

<div id="quiz-overlay">
    <button id="leader-close-x" class="quiz-close-btn" onclick="closeQuizOverlay()">×</button>
    <div class="click-counter" id="clicks-remaining">Selections: 0/0</div>
    <div class="quiz-timer" id="global-timer">120</div>
    <h2 id="question-text" style="text-align:center;">Question</h2>
    <div class="quiz-options" id="quiz-options"></div>
    <p id="status-text" style="margin-top:20px; color:#f1c40f;">Hurry!</p>
</div>

<div class="overlay" id="overlay" onclick="closeModal()"></div>

<div class="wrapper" id="main-wrapper">
    <div id="leaderboard" onclick="if(this.classList.contains('minimized')) toggleRank()">
        <div class="rank-header">
            <h3>Points</h3>
            <button onclick="event.stopPropagation(); toggleRank()" style="cursor:pointer; background:none; border:none; font-weight:bold;">–</button>
        </div>
        <div id="rank-list" class="rank-content"></div>
    </div>

    <div class="admin-controls" id="admin-ui" style="display:none;">
        <button id="start-btn" class="trigger-btn" onclick="startNewQuestion()">START</button>
        <button id="close-btn" class="close-quiz-btn" onclick="adminCloseQuiz()">CLOSE</button>
    </div>

    <div id="zoom-container" onclick="toggleZoom(event)">
        <!-- FIXED: Changed from imgur.com to i.imgur.com with proper extension -->
        <!-- RECOMMENDATION: Replace with your own hosted image or reliable CDN -->
        <img src="https://i.imgur.com/OPX6wON.png" 
             class="base-img" 
             alt="Respiratory System Diagram"
             onerror="this.parentElement.innerHTML='<div class=\'img-fallback\' style=\'width:100%;height:100%;\'>Image failed to load.<br>Please check your connection.</div>'">

        <!-- Title Button -->
        <button class="title-btn" onclick="showData('Respiratory System', '')">RESPIRATORY SYSTEM</button>

        <!-- Left Side Buttons -->
        <button class="cover-btn" style="top: 18%; left: 8%; border-color: #2ed573; width: 160px;" onclick="showData('Nasal Cavity', 'The nasal cavity is surrounded by <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Air-filled spaces in head bones.&quot;)\'>paranasal sinuses</span>, which <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Make skull lighter and voice louder.&quot;)\'>lighten the skull and amplify voice</span> for speech. It also connects with the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The mouth.&quot;)\'>oral cavity</span> through the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Roof of the mouth.&quot;)\'>palate</span>, and <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Tubes that drain tears from eyes to nose.&quot;)\'>nasolacrimal ducts</span> drain tears into it. Sinuses make mucus that drains into the nasal cavity, helping to <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Catch dirt and keep moist.&quot;)\'>trap debris and maintain moisture</span>. The palate separates the nasal cavity from the oral cavity, with a <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Hard, bony front part of mouth roof.&quot;)\'>hard palate</span> (front) and <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Soft, flexible back part of mouth roof.&quot;)\'>soft palate</span> (back). But, <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Body problems.&quot;)\'>homeostatic imbalances</span> can occur: <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Stuffy nose from viruses or allergies.&quot;)\'>rhinitis</span> (swelling from viruses/allergies, causing stuffy nose and mucus dripping down throat), and <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Sinus swelling from blocked fluid, causing headaches.&quot;)\'>sinusitis</span> (blocked fluid in sinuses, causing headaches and voice changes).', 'text')">Nasal Cavity</button>
        <button class="cover-btn" style="top: 27%; left: 5%; border-color: #2ed573;" onclick="showData('Nostril', 'The nose is the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Part of the body you see.&quot;)\'>externally visible</span> part of the breathing system, where <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Air goes in through these holes.&quot;)\'>air enters through the nostrils (nares)</span> into the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Space inside your nose.&quot;)\'>nasal cavity</span>. This space is split by the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Wall inside your nose.&quot;)\'>nasal septum</span>. The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Top part of your nose, for smell.&quot;)\'>superior portion</span> has <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Cells that detect smells.&quot;)\'>olfactory receptors</span>. The rest of the nose is lined with <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Wet skin with tiny blood tubes.&quot;)\'>respiratory mucosa</span>, which <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Makes air warm, wet, and cleans it.&quot;)\'>warms, moistens, and traps bacteria</span> using <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Blood tubes close to the surface.&quot;)\'>superficial blood vessels</span> and snot. <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Tiny hairs.&quot;)\'>Cilia</span> (tiny hairs) push dirty snot to the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Back of your throat.&quot;)\'>pharynx</span> (throat) to be swallowed. <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Curved bones in the nose.&quot;)\'>Conchae</span> (curved bones) make the air swirl to catch more dirt. A <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Body not working right.&quot;)\'>homeostatic imbalance</span> like <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A birth defect where the roof of the mouth is split.&quot;)\'>cleft palate</span> (a split in the roof of the mouth) can make it hard to breathe, eat, and talk.', 'text')">Nose & Nostril</button>
        <button class="cover-btn" style="top: 36%; left: 5%; border-color: #1e90ff;" onclick="showData('Soft Palate', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The fleshy back part of the roof of your mouth.&quot;)\'>soft palate</span>, also known as the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Another term for the soft palate.&quot;)\'>velum</span>, is the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Flexible back part of the roof of your mouth.&quot;)\'>fleshy, muscular posterior part of the roof of the mouth</span>, located at the back of the oral cavity. In the context of the respiratory system, its primary function is to <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Block the path to the nose.&quot;)\'>seal off the nasopharynx</span> (the upper part of the throat behind the nose) during <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The act of swallowing.&quot;)\'>swallowing</span>. This action <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Keeps food and liquids out of your nose.&quot;)\'>prevents food and liquids from entering the nasal cavity and subsequently the respiratory passages</span>, ensuring that air can pass freely during breathing when not swallowing. It also helps in <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Making different speech sounds by controlling airflow.&quot;)\'>modulating airflow for certain speech sounds</span>.')">Soft Palate</button>    
        <button class="cover-btn" style="top: 42%; left: 5%; border-color: #ffa502;" onclick="showData('Hard Palate', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The bony front part of the roof of your mouth.&quot;)\'>hard palate</span> is the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Rigid front part of the roof of your mouth.&quot;)\'>bony, anterior portion of the roof of the mouth</span>, forming the ceiling of the oral cavity and the floor of the nasal cavity. In relation to the respiratory system, its main function is to <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Form a solid divider between your mouth and nose.&quot;)\'>provide a rigid separation between the oral cavity and the nasal cavity</span>. This structural integrity is vital for maintaining the distinct pathways for air (through the nasal cavity and then the pharynx) and food (through the oral cavity and then the pharynx), allowing for efficient <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Breathing.&quot;)\'>respiration</span> and preventing air from escaping through the mouth during nasal breathing, especially when the mouth is closed. It also aids in <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Helping to make sounds for speaking.&quot;)\'>articulating certain speech sounds</span>.')">Hard Palate</button>
        <button class="cover-btn" style="top: 48%; left: 5%; border-color: #a29bfe;" onclick="showData('Oral Cavity', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The mouth; the space inside your mouth.&quot;)\'>oral cavity</span> is the mouth, where air can enter the body during breathing. It serves as an <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Another way or route for something to go.&quot;)\'>alternative passage</span> for air, especially when the nose is <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Closed off or obstructed, so nothing can pass through.&quot;)\'>blocked</span>. The tongue helps keep the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The path that air takes to get into and out of the lungs.&quot;)\'>airway</span> open and <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Directs or controls the movement of something.&quot;)\'>guides the flow</span> of air toward the throat. It also plays a role in speaking while air passes through the mouth.', 'text')">Oral Cavity</button>
        <button class="cover-btn" style="top: 55%; left: 8%; border-color: #ff6b6b;" onclick="showData('Larynx', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Your voice box, below the throat.&quot;)\'>larynx, or voice box, is located below the pharynx</span> and is composed of <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Stiff but bendy parts.&quot;)\'>cartilages</span>, including the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The bump on your throat.&quot;)\'>thyroid cartilage (Adam’s apple)</span> and the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A flap that closes your windpipe.&quot;)\'>epiglottis</span>. It <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Directs air to lungs and food to stomach.&quot;)\'>functions to route air and food into their proper channels</span>. The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Stretchy bands that make sound.&quot;)\'>vocal folds</span> within the larynx <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Vibrate to make sounds when you talk.&quot;)\'>vibrate to produce speech</span>, while the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Opening between vocal folds.&quot;)\'>glottis</span> serves as the opening between them. Additionally, the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Automatic reaction to clear throat.&quot;)\'>cough reflex</span> <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Helps clear foreign stuff from air tube.&quot;)\'>helps expel foreign substances from the airway</span>. However, homeostatic imbalances may occur when food or liquid enters the larynx, triggering the cough reflex to remove it; this reflex, however, does not function when a person is unconscious, making it dangerous to give fluids to someone who has fainted. Disorders affecting the vocal cords can also impair speech and communication.', 'text')">Larynx</button>
        <button class="cover-btn" style="top: 61%; left: 9%; border-color: #48dbfb;" onclick="showData('Trachea', 'The trachea (windpipe) carries air from the larynx to the midchest; its C-shaped <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A strong but flexible tissue that forms the C-shaped rings. It acts like a sturdy support so the windpipe does not collapse or close.&quot;)\'>Hyaline Cartilage</span> rings keep it open while letting the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The tube that carries food and liquids from your mouth down to your stomach. It is located right behind the trachea.&quot;)\'>Esophagus</span> expand during swallowing. Since it’s the only air route to the lungs, <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A blockage or something that stops the flow of air. If this happens in the trachea, you cannot breathe.&quot;)\'>Obstruction</span> is life-threateningly relieved by the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;An emergency procedure done by pushing hard on a persons stomach to force out an object stuck in the throat or windpipe.&quot;)\'>Heimlich Maneuver</span> or emergency <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A surgical operation where doctors make a small cut and hole in the neck to create a new way for air to get into the lungs when the upper airway is blocked.&quot;)\'>Tracheostomy</span> if needed. Lined with <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The special lining inside the trachea that has tiny hair-like parts called cilia. These hairs move to sweep dust, dirt, and mucus out of your lungs.&quot;)\'>Ciliated Mucosa</span>, it works to maintain healthy airflow to the lungs.', 'text')">Trachea</button>
        <button class="cover-btn" style="top: 69%; left: 6%; border-color: #ff9f43; width: 200px;" onclick="showData('Carina of Trachea', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A ridge or small projection shaped like the keel of a boat. It is the point where the windpipe splits into two.&quot;)\'>Carina</span> is a small, ridge-like structure located at the very bottom of the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The windpipe, which is the main tube that carries air down from your throat to your lungs.&quot;)\'>Trachea</span>. It marks the point where the windpipe divides into two main tubes called the right and left <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The two large tubes that branch off from the end of the trachea and carry air into the lungs.&quot;)\'>Bronchi</span>. It is very <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Reacts very easily. It causes strong coughing if anything touches it.&quot;)\'>Sensitive</span> and helps protect the lungs.', 'text')">Carina of Trachea</button>
        <button class="cover-btn" style="top: 76%; left: 3%; border-color: #26de81; width: 215px;" onclick="showData('Right Main Bronchus', 'The right main <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A large airway tube that branches off from the trachea and carries air into the lungs.&quot;)\'>Bronchus</span> is wider, shorter, and straighter than the left, forming as one of two <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Parts or sections created when something is split or separated into two.&quot;)\'>Divisions</span> of the trachea before entering the right lung’s <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The specific area on the lung where tubes and vessels enter and leave.&quot;)\'>Hilum</span> and because of its <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The shape, size, and arrangement of parts that make up an organ.&quot;)\'>Structure</span>, it is the more common site for inhaled <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Things that do not belong inside the body, like food or small items accidentally breathed in.&quot;)\'>Foreign Objects</span> to become <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Stuck firmly in a place and unable to move or get out.&quot;)\'>Lodged</span>.', 'text')">Right Main Bronchus</button>
        <button class="cover-btn" style="top: 84%; left: 8%; border-color: #0fbcf9;" onclick="showData('Right Lung', 'The right lung has three <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Separate parts or sections that make up an organ. The right lung is divided into three of these parts.&quot;)\'>Lobes</span>, occupying part of the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The space inside your chest that holds your lungs, heart, and other important organs.&quot;)\'>Thoracic Cavity</span> alongside the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The space in the middle of the chest, between the two lungs, which contains the heart, major blood vessels, and other structures.&quot;)\'>Mediastinum</span>, with its base resting on the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A large, strong muscle located at the bottom of the chest cavity that helps you breathe in and out.&quot;)\'>Diaphragm</span> and <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The top or highest point of an organ or structure. In the lung, this is the pointed upper part.&quot;)\'>Apex</span> deep to the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The long, thin bone that connects your shoulder to your chest, also known as the collarbone.&quot;)\'>Clavicle</span>. It is covered by a <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A thin, smooth membrane that covers the outer surface of the lungs directly.&quot;)\'>Visceral Pleura</span> that glides smoothly against the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A thin membrane that lines the inside of the chest wall, covering the area around the lungs.&quot;)\'>Parietal Pleura</span> lining the chest wall, enabled by slippery <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A small amount of slippery liquid between the pleural membranes that helps the lungs move smoothly without friction when you breathe.&quot;)\'>Pleural Fluid</span>.', 'text')">Right Lung</button>

        <!-- Right Side Buttons -->
        <button class="cover-btn" style="top: 20%; right: 13%; border-color: #ef5777; width: 180px;" onclick="showData('Pharyngeal Tonsils', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;These are also called adenoids.&quot;)\'>pharyngeal tonsils</span>, also known as <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Lymphatic tissues found in the throat.&quot;)\'>adenoids</span>, are clusters of <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Tissue that fights germs.&quot;)\'>lymphatic tissue</span> located high in the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Upper part of the throat behind the nose.&quot;)\'>nasopharynx</span>, which is the part of the pharynx behind the nasal cavity. Their primary function is to act as a part of the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The defense system of ones body.&quot;)\'>immune system</span> by <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Catching harmful germs.&quot;)\'>trapping pathogens</span>, such as bacteria and viruses, that enter the body through the nose. This helps to prevent infections and contributes to the body\'s overall defense against illness.')">Pharyngeal Tonsil</button>
        <button class="cover-btn" style="top: 28%; right: 13%; border-color: #575fcf; width: 160px;" onclick="showData('Nasopharynx', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The top part of your throat, behind your nose.&quot;)\'>nasopharynx</span> is located behind the nasal cavity and is primarily responsible for <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Moving air from your nose down into your body.&quot;)\'>connecting air from the nose to the lower respiratory tract</span>.')">Nasopharynx</button>
        <button class="cover-btn" style="top: 36%; right: 13%; border-color: #05c46b; width: 160px;" onclick="showData('Oropharynx & Laryngopharynx', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The middle part of your throat, behind your mouth.&quot;)\'>oropharynx</span> is situated behind the oral cavity and functions as a <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A path for both food and air.&quot;)\'>passageway for both food and air</span>, facilitating their movement towards the esophagus and larynx, respectively. Within the oropharynx, you will find the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Tonsils located on the sides of your throat.&quot;)\'>palatine tonsils</span>. <br> The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The bottom part of your throat.&quot;)\'>laryngopharynx</span>, also known as the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Another name for the bottom part of your throat.&quot;)\'>hypopharynx</span>, plays a crucial role in <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Making sure food goes to the stomach tube and air goes to the voice box.&quot;)\'>directing food into the esophagus and air into the larynx</span>, ensuring proper separation of these pathways during swallowing. At the base of the tongue, which is part of this general area, lie the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Tonsils found at the back of your tongue.&quot;)\'>lingual tonsils</span>.')">Oropharynx & Laryngopharynx</button>
        <button class="cover-btn" style="top: 42%; right: 17%; border-color: #ffc048; width: 130px" onclick="showData('Tongue', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The muscular organ in your mouth.&quot;)\'>tongue</span> is a <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Strong group of muscles.&quot;)\'>muscular organ</span> located on the floor of the mouth. For the respiratory system, its key roles involve <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Moving food to help you swallow.&quot;)\'>initiating the swallowing reflex</span>, which is crucial for preventing food and liquids from entering the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The windpipe.&quot;)\'>trachea</span> (windpipe) and lungs. It also plays a significant role in <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Adjusting the space in your mouth and throat.&quot;)\'>modulating the size and shape of the oral cavity and pharynx</span>, which impacts <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;How air flows when you breathe.&quot;)\'>airflow dynamics during breathing</span> and contributes to <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Clear speaking.&quot;)\'>speech articulation</span>. Proper tongue position is also important for maintaining an open <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The path for air.&quot;)\'>airway</span>, particularly during sleep.')">Tongue</button>      
        <button class="cover-btn" style="top: 48%; right: 17%; border-color: #8c7ae6;width: 120px" onclick="showData('Epiglottis', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A spoon-shaped flap of flexible tissue.&quot;)\'>epiglottis</span> is a spoon-shaped flap of elastic cartilage that <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Stops food from going into the windpipe.&quot;)\'>prevents food from entering the airway</span>. It <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Closes during swallowing.&quot;)\'>closes during swallowing</span> to <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Protect the air tube.&quot;)\'>protect the airway</span>. The epiglottis is part of the larynx.')">Epiglottis</button>
        <button class="cover-btn" style="top: 28%; right: 1%; border-color: #1dd1a1; width: 95px" onclick="showData('Pharynx', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Commonly known as the throat, it is a muscular tube behind the mouth and nasal cavity.&quot;)\'>pharynx</span>, commonly called the throat, is a <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A pipe-like structure made of muscles that can contract and relax to move substances.&quot;)\'>muscular tube</span> about 13 cm long. It serves as a <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A shared path or route used by more than one thing, like food and air.&quot;)\'>common passageway</span> for food and air. Clusters of <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Tissue that is part of the immune system, helping to fight off infections.&quot;)\'>lymphatic tissue</span> called <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Clusters of lymphatic tissue in the pharynx that help protect the body from germs.&quot;)\'>tonsils</span> are also found here. The pharynx functions as a shared passageway that directs air into the larynx and food into the esophagus, while also connecting to the middle ear through the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Tubes connecting the pharynx to the middle ear, also known as Eustachian tubes.&quot;)\'>pharyngotympanic tubes</span>. It contains tonsils that serve as a <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A natural way the body protects itself from harm or disease.&quot;)\'>defense mechanism</span>, guarding against infection. However, <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Conditions where the internal environment of body is not stable or balanced.&quot;)\'>homeostatic imbalances</span> can occur when the pharyngeal tonsils become <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Swollen, red, and painful due to infection or injury.&quot;)\'>inflamed</span>, <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Blocking or making it difficult for something to pass through.&quot;)\'>obstructing</span> the nasopharynx and forcing individuals to breathe through the mouth, which <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Goes around or avoids a usual route or process.&quot;)\'>bypasses</span> the nose’s warming and <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The job of removing harmful particles or impurities.&quot;)\'>filtering functions</span>. Children commonly experience <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Inflammation of the tonsils, usually due to infection.&quot;)\'>tonsillitis</span>, although the use of <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Medicines used to treat bacterial infections.&quot;)\'>antibiotics</span> today has reduced the need for tonsil removal. Additionally, ear infections such as <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;An infection of the middle ear.&quot;)\'>otitis media</span> may develop following pharyngeal infections due to the connected tubes between the pharynx and the middle ear.', 'text')">Pharynx</button>
        <button class="cover-btn" style="top: 55%; right: 10%; border-color: #e55039; "onclick="showData('Esophagus', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A long muscular tube that connects the throat to the stomach, also called the food pipe.&quot;)\'>Esophagus</span> is a long, strong <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A pipe made of muscles that squeeze and push things along.&quot;)\'>Muscular Tube</span>. It carries food and liquids from your mouth down to your stomach using wave-like movements called <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The squeezing movement that pushes food down automatically.&quot;)\'>Peristalsis</span>. It is located <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Positioned right behind the windpipe or trachea.&quot;)\'>Posterior</span> to the trachea.', 'text')">Esophagus</button>
        <button class="cover-btn" style="top: 63%; right: 11%; border-color: #00d8d6; width: 180px;" onclick="showData('Left Main Bronchus', 'The left main bronchus runs more <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Slanting or at an angle. It does not go straight down, but goes downwards and to the side.&quot;)\'>Obliquely</span> to reach the left lung’s <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The specific area on the lung where tubes and vessels enter and leave.&quot;)\'>Hilum</span> after branching from the trachea; while narrower and longer than the right, it still delivers warm, cleansed, and <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Made wet or moist so it doesn\'t dry out the lungs.&quot;)\'>Humidified</span> air, with its smaller <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Smaller branches or parts that come out from the main tube.&quot;)\'>Subdivisions</span> serving as direct <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Routes or roads that allow something to pass through.&quot;)\'>Pathways</span> to the lung’s <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The tiny pockets at the end of the airways where oxygen enters the blood.&quot;)\'>Air Sacs</span>.', 'text')">Left Main Bronchus</button>
        <button class="cover-btn" style="top: 71%; right: 10%; border-color: #3c40c6; width: 95;" onclick="showData('Bronchi', 'The <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Large air tubes in your lungs.&quot;)\'>bronchi</span> are the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Two main tubes that branch from the windpipe.&quot;)\'>two main air passages that branch off from the trachea</span> (windpipe) and lead into the lungs. Their primary function is to <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Carry air to and from your lungs.&quot;)\'>conduct inhaled air to the lung tissue</span>, where gas exchange occurs, and exhaled air away from the lungs.')">Bronchi</button>
        <button class="cover-btn" style="top: 82%; right: 10%; border-color: #0be881;" onclick="showData('Left Lung', 'The left lung has two <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Separate parts or sections that make up an organ. The left lung is divided into two of these parts.&quot;)\'>Lobes</span> to accommodate the heart in the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The space in the middle of the chest, between the two lungs, which contains the heart and major blood vessels.&quot;)\'>Mediastinum</span>, sharing the same structural features of an <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The top or highest part of the lung located just under the collarbone.&quot;)\'>Apical Portion</span> under the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The long, thin bone that connects your shoulder to your chest, also known as the collarbone.&quot;)\'>Clavicle</span> and a <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The bottom or lower part of the lung that rests on top of the breathing muscle.&quot;)\'>Basal Area</span> on the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A large, strong muscle located at the bottom of the chest cavity that helps you breathe in and out.&quot;)\'>Diaphragm</span>, with its <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Thin, smooth layers of tissue that cover the lungs and line the chest wall to help them move easily.&quot;)\'>Pleural Membranes</span> tightly adhering to the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The bony and muscular structure of your chest that protects the lungs and heart.&quot;)\'>Thorax Wall</span> to support normal breathing movements.', 'text')">Left Lung</button>
        <button class="cover-btn" style="top: 89%; right: 10%; border-color: #222f3e;" onclick="showData('Diaphragm', 'The diaphragm is the primary muscle of <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The process of breathing in oxygen and breathing out carbon dioxide.&quot;)\'>Respiration</span>, a dome-shaped sheet of muscle and <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A strong type of body tissue that connects, supports, or holds parts of the body together.&quot;)\'>Connective Tissue</span> that separates the <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The space inside your chest where your lungs and heart are located.&quot;)\'>Thoracic Cavity</span> and <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;The space inside your belly where your stomach and intestines are found.&quot;)\'>Abdominal Cavity</span>. When it <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;When a muscle becomes tight or shorter to cause movement.&quot;)\'>Contracts</span>, it flattens to expand the chest space and draw air into the lungs. This vital muscle works in <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;Working together smoothly with other parts to do a job properly.&quot;)\'>Coordination</span> with the rib cage muscles. Its downward movement creates <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;A pulling force like a vacuum that sucks air into the lungs.&quot;)\'>Negative Pressure</span>, while its upward <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;To spring back to its original shape after being moved.&quot;)\'>Recoil</span> helps <span class=\'speech-link\' onclick=\'event.stopPropagation(); speak(&quot;To force something out or push something away.&quot;)\'>Expel</span> air, making it essential for life.', 'text')">Diaphragm</button>

<script>
    // --- SOCKET & STATE ---
    const socket = io();
    let currentRole = "player";
    let myUsername = "";
    let myGroup = "";
    let myScore = 0;
    let quizActive = false;
    let currentCountdown = null;
    let currentQuestionIndex = 0;
    let currentQuestionData = null;
    let hasSubmitted = false;
    let groupSelections = [];
    let player;

    // --- FULLSCREEN FUNCTIONS ---
    function enterFullScreen() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
    }

    function forceFullscreenMode() {
        if (!document.fullscreenElement && currentRole === "player" && myUsername !== "") {
            enterFullScreen();
        }
    }

    document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'f') enterFullScreen();
    
    // This allows the leader to exit, but players remain trapped by forceFullscreenMode
    if (e.key.toLowerCase() === 'e' && currentRole === "leader") {
        // Remove the listener temporarily so it doesn't force you back in
        document.removeEventListener('fullscreenchange', forceFullscreenMode);
        
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
        
        // Re-add it after a short delay if you want it active again later
        setTimeout(() => {
            document.addEventListener('fullscreenchange', forceFullscreenMode);
        }, 2000);
    }
});

    // --- MUSIC SYSTEM WITH LOOP ---
    const playlist = ["vmb7Lzj0eO0", "9_5GuUd5kW4", "3UvAYNGY_XA"]; 
    
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-player', {
            height: '0', width: '0',
            videoId: playlist[0],
            playerVars: { 
                'autoplay': 0, 
                'controls': 0,
                'loop': 1,
                'playlist': playlist.join(',')
            },
            events: { 
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        console.log("YouTube Player Ready");
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
            playRandomMusic();
        }
    }

    function playRandomMusic() {
        if(player && player.loadVideoById) {
            const randomID = playlist[Math.floor(Math.random() * playlist.length)];
            player.loadVideoById({
                videoId: randomID,
                startSeconds: 0,
                suggestedQuality: 'small'
            });
            player.playVideo();
        }
    }

    function stopMusic() { 
        if(player && player.stopVideo) {
            player.stopVideo();
        } 
    }

    // --- LOGIN ---
    function login() {
    const name = document.getElementById('user-name').value;
    const group = document.getElementById('group-id').value;
    const pass = document.getElementById('pass-id').value;
    
    if(!name || !pass) return alert("Please fill credentials");

    enterFullScreen();

    if(group.trim() === "") {
        // --- ADMIN / VIEWER CHECK ---
        if (pass === "renz123") {
            // Full Admin: Has everything
            currentRole = "leader";
            document.getElementById('admin-ui').style.display = 'flex';
            document.getElementById('leaderboard').style.display = 'block';
            document.getElementById('leader-close-x').style.display = 'block';
        } 
        else if (pass === "sciences") { 
            // VIEWER MODE: Hide the side buttons (labels), keep tap nodes
            currentRole = "viewer"; 
            document.getElementById('admin-ui').style.display = 'none';
            document.getElementById('leaderboard').style.display = 'none';
            document.getElementById('leader-close-x').style.display = 'none';
            
            // Hide all anatomy label buttons
            const labelButtons = document.querySelectorAll('.cover-btn');
            labelButtons.forEach(btn => btn.style.display = 'none');
            
            console.log("Logged in as Viewer (Nodes Only)");
        }
        else if (pass === "sciences3") { 
            // Previous Viewer Admin logic
            currentRole = "leader"; 
            document.getElementById('admin-ui').style.display = 'none';
            document.getElementById('leaderboard').style.display = 'none';
            document.getElementById('leader-close-x').style.display = 'block';
        } 
        else {
            return alert("Password Incorrect");
        }
    } else {
        // --- PLAYER LOGIN ---
        currentRole = "player";
        myGroup = group;
        document.getElementById('group-display').innerText = "GROUP: " + group;
        document.getElementById('waiting-screen').style.display = 'flex';
        document.getElementById('leader-close-x').style.display = 'none';
    }

    myUsername = name;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-wrapper').style.display = 'block';
    
    socket.emit('user-join', { username: name, group: group, role: currentRole });
}
    
    // Function to handle Text-to-Speech
function speak(text) {
    // Cancel any ongoing speech first
    window.speechSynthesis.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.7; // Slightly slower for clarity
    utterance.pitch = 1;
    window.speechSynthesis.speak(utterance);
}

    // FIXED: Properly handle all content types - only show what's provided
    function showData(title, desc, type) {
    event.stopPropagation();
    
    const mTitle = document.getElementById('mTitle');
    const mDesc = document.getElementById('mDesc');
    const mediaBox = document.getElementById('mediaBox');
    
    mTitle.innerText = title;
    
    const isUrl = desc && (desc.startsWith('http') || desc.includes('imgur'));
    
    if (isUrl) {
        mDesc.style.display = 'none';
        // Changed: Removed height: 100% from the container style
        // Added: width: 100% and height: auto to the image
        mediaBox.style.height = "auto"; 
        mediaBox.innerHTML = `
            <img src="${desc}" 
                 style="width: 100%; height: auto; display: block; border-radius: 8px;" 
                 onerror="this.src='https://picsum.photos/600/400'">`;
        mediaBox.style.display = 'block';
    } else {
        mDesc.innerHTML = desc || '';
        mDesc.style.display = desc ? 'block' : 'none';

        if (type === 'video') {
            mediaBox.innerHTML = '<iframe width="100%" height="250px" src="https://www.youtube.com/embed/mOKmjYwfDGU" frameborder="0" allowfullscreen></iframe>';
            mediaBox.style.display = 'block';
        } else if (type === 'image') {
            mediaBox.innerHTML = `<img src="https://picsum.photos/seed/${encodeURIComponent(title)}/600/400" style="width: 100%; height: auto; border-radius: 8px;">`;
            mediaBox.style.display = 'block';
        } else {
            mediaBox.style.display = 'none';
        }
    }

    document.getElementById('modal').classList.add('active');
    document.getElementById('overlay').style.display = 'block';
}
    
    function closeModal() {
        document.getElementById('modal').classList.remove('active');
        document.getElementById('overlay').style.display = 'none';
    }

    // --- QUIZ SYSTEM ---
    const allQuizData = [
        { question: "Which are parts of the Upper Respiratory Tract?", options: ["Nasal Cavity", "Pharynx", "Trachea", "Alveoli"], correctIndices: [0, 1], timer: 120 },
        { question: "Identify the main muscles used in breathing:", options: ["Diaphragm", "Biceps", "Intercostals", "Heart"], correctIndices: [0, 2], timer: 120 },
        {question: "Which of the following statements correctly describe the structure and function of the trachea?", options: ["It transports air from the larynx down towards the lungs.", "It is supported by C-shaped hyaline cartilage rings to prevent collapse.", "The cartilage rings allow the esophagus to expand during swallowing.", "It actively pushes air into the lungs using muscular contractions.", "It serves as the main passageway for food entering the digestive system."], correctIndices: [0, 1, 2, 3], timer: 120}, 
    ];

    function startNewQuestion() {
        if (currentQuestionIndex < allQuizData.length) {
            socket.emit('trigger-question', allQuizData[currentQuestionIndex]);
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').innerText = "IN PROGRESS...";
            currentQuestionIndex++; 
        } else {
            alert("Quiz Over.");
            currentQuestionIndex = 0;
            resetQuizUI();
        }
    }

    function adminCloseQuiz() {
        socket.emit('close-quiz-manual');
        resetQuizUI();
    }

    function resetQuizUI() {
        document.getElementById('close-btn').style.display = 'none';
        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('start-btn').disabled = false;
        document.getElementById('start-btn').innerText = "START NEXT QUESTION";
        closeQuizOverlay();
    }

    function closeQuizOverlay() {
        if(currentCountdown) clearInterval(currentCountdown);
        document.getElementById('quiz-overlay').style.display = 'none';
        quizActive = false;
        stopMusic();
    }

    socket.on('show-quiz-overlay', (data) => {
        quizActive = true;
        hasSubmitted = false;
        groupSelections = [];
        
        let items = data.options.map((opt, i) => ({ text: opt, originalIdx: i }));
        for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
        }
        const newCorrectIndices = [];
        items.forEach((item, newIdx) => {
            if (data.correctIndices.includes(item.originalIdx)) newCorrectIndices.push(newIdx);
        });
        currentQuestionData = { ...data, options: items.map(i => i.text), correctIndices: newCorrectIndices };

        playRandomMusic();
        document.getElementById('quiz-overlay').style.display = 'flex';
        document.getElementById('question-text').innerText = data.question;
        document.getElementById('status-text').innerText = "Select carefully!";
        document.getElementById('clicks-remaining').innerText = `Selections: 0/${data.correctIndices.length}`;
        
        const optionsBox = document.getElementById('quiz-options');
        optionsBox.innerHTML = "";
        currentQuestionData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = "quiz-opt";
            btn.innerText = opt;
            btn.id = "opt-" + idx;
            btn.onclick = () => {
                if(!quizActive || currentRole === "leader" || btn.disabled) return;
                socket.emit('group-selection-attempt', {
                    group: myGroup,
                    optionIndex: idx,
                    maxClicks: data.correctIndices.length
                });
            };
            optionsBox.appendChild(btn);
        });

        let timeLeft = data.timer;
        document.getElementById('global-timer').innerText = timeLeft;
        currentCountdown = setInterval(() => {
            timeLeft--;
            document.getElementById('global-timer').innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(currentCountdown);
                handleTimeUp();
            }
        }, 1000);
    });

    socket.on('group-selection-update', (data) => {
        const btn = document.getElementById("opt-" + data.optionIndex);
        if(btn) {
            btn.disabled = true;
            btn.classList.add('player-selected');
        }
        groupSelections = data.selectionsSoFar;
        document.getElementById('clicks-remaining').innerText = `Selections: ${groupSelections.length}/${data.maxClicks}`;
        
        if(groupSelections.length >= data.maxClicks) {
            socket.emit('trigger-global-stop');
        }
    });

    socket.on('receive-global-stop', () => {
        if (currentCountdown) {
            clearInterval(currentCountdown);
            handleTimeUp();
        }
    });

    function submitPoints() {
        hasSubmitted = true;
        let correctCount = groupSelections.filter(idx => currentQuestionData.correctIndices.includes(idx)).length;
        myScore += (correctCount * 10);
        document.getElementById('p-score-board').innerText = myScore;
        socket.emit('score-update', { group: myGroup, score: myScore });
    }

    function handleTimeUp() {
        if(!quizActive) return;
        quizActive = false;
        stopMusic();
        currentQuestionData.correctIndices.forEach(idx => {
            const btn = document.getElementById("opt-" + idx);
            if(btn) btn.classList.add('correct-answer');
        });
        document.getElementById('status-text').innerText = "Answer checking complete!";
        
        if(currentRole === "player") {
            if(!hasSubmitted) submitPoints();
            setTimeout(closeQuizOverlay, 4000);
        } else {
            document.getElementById('close-btn').style.display = 'block';
        }
    }

    socket.on('update-leaderboard', (leaderboard) => {
        if(currentRole !== "leader") return;
        const list = document.getElementById('rank-list');
        list.innerHTML = "";
        Object.entries(leaderboard).sort((a,b) => b[1]-a[1]).forEach(([name, score]) => {
            const div = document.createElement('div');
            div.className = "rank-item";
            div.innerHTML = `<span><b>${name}</b></span> <span class="group-pill">${score} PTS</span>`;
            list.appendChild(div);
        });
    });

    socket.on('hide-quiz-overlay', closeQuizOverlay);
    socket.on('group-members-update', (count) => {
        const el = document.getElementById('group-members-count');
        if(el) el.innerText = `Group Members Online: ${count}`;
    });

    function toggleRank() { document.getElementById('leaderboard').classList.toggle('minimized'); }
    window.addEventListener('beforeunload', () => socket.emit('user-leave', { username: myUsername, group: myGroup }));
</script>
